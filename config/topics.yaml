  - name: "Pre-inference input sanitization for generation stability"
    description: >
      Prompt and context preprocessing that prevents degenerate
      generation: near-duplicate context collapse, input
      normalization, constrained or grammar-based decoding setup,
      and adversarial prompts that deliberately induce repetition
      loops. NOT general inference-efficiency work — cache
      compression and serving throughput belong to the inference
      efficiency topic below.

  - name: "Post-inference detection and repair of degenerate output"
    description: >
      Detecting and recovering from repetition loops during or after
      decoding: n-gram and rolling-hash loop detectors, compression
      ratio and type-token-ratio collapse metrics, scheduler-level
      early stopping, truncation and resampling repair policies.

  - name: "LLM inference efficiency and long-context serving"
    description: >
      Making decoding cheaper or longer-context rather than more
      stable: KV-cache compression, eviction and quantization,
      speculative and multi-token decoding, attention kernels,
      paged/batched serving schedulers, and algorithm-hardware
      co-design for the decode path.

# Robotics topics above are parked; re-add cs.RO and eess.SY to
