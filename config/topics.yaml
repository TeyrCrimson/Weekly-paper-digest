topics:
  - name: "Onboard object detection from a moving UAV"
    description: >
      Making a real-time single-stage detector (YOLO family, RT-DETR and
      similar) hold up when the camera is on a drone in flight: small and
      low-pixel targets seen from altitude, motion blur and rolling-shutter
      smear from platform vibration and fast yaw, rapid scale and viewpoint
      change between consecutive frames, aerial domain shift away from
      ground-collected training data, augmentation and synthetic data for
      UAV imagery, temporal or tracking-assisted detection that stabilises
      boxes across frames, and latency/accuracy trade-offs on embedded
      edge GPUs (Jetson, OAK, NPU). NOT generic COCO architecture papers
      with no motion, aerial, or on-device latency angle.

  - name: "Metric and temporally-consistent monocular depth"
    description: >
      Fixing scale and shift ambiguity in monocular depth foundation models
      (Depth Anything V2/V3, Metric3D, UniDepth, ZoeDepth, MoGe): recovering
      genuinely metric depth from known camera intrinsics, per-frame
      scale/shift drift where the network re-normalises as the scene
      changes, temporally consistent video depth under camera translation,
      keeping a static ground plane static while the camera climbs or
      descends, and pinning absolute scale by fusing depth with IMU,
      barometer, VIO, or sparse metric anchors. Includes benchmarks and
      metrics that actually measure scale drift over a trajectory rather
      than only per-frame relative error.

